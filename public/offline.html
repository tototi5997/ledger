<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#26251e" />
    <title>Ledger 离线</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f7f4;
        color: #26251e;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(420px, calc(100% - 32px));
        border: 1px solid #e6e5e0;
        border-radius: 24px;
        background: #ffffff;
        padding: 24px;
      }
      p {
        margin: 8px 0 0;
        color: #5a5852;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>Ledger</strong>
      <p>当前网络不可用。请恢复网络后继续查看或记录账目。</p>
    </main>
  </body>
</html>
